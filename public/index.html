<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BudgetBuddy</title>
    <link rel="icon" href="https://soundcloud.com/ygspeed/outcome-income" type="image/png"> <!-- Updated favicon path -->

<body>

    </header>
    
   

    <!-- This is where React will mount the app -->
    <div id="root"></div> <!-- Ensure this element exists for React to mount -->

    <script>
        // JavaScript to update the budget
        document.querySelector('#add-amount').addEventListener('click', function() {
            let budgetElement = document.querySelector('#budget');
            let currentBudget = parseFloat(budgetElement.textContent.replace('Your Budget: $', ''));
            budgetElement.textContent = `Your Budget: $${(currentBudget + 100).toFixed(2)}`;
        });
    </script>
    
</body>
